<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アイカツアンコールカード管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff5f8;--ink:#3b2938;--sub:#8a7083;--rose:#e0457b;--gold:#d9a23a;--line:#f1d3de;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--line);padding:10px 14px 12px}
.top h1{margin:0;font-size:18px;font-weight:900;color:var(--rose);letter-spacing:.02em}
.top p{margin:2px 0 8px;font-size:12px;color:var(--sub)}
.prog{display:flex;align-items:center;gap:10px}
.prog b{font-size:14px;white-space:nowrap}
.bar{flex:1;height:10px;border-radius:99px;background:#f6e4ea;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0b83f,#f06fa4);transition:width .3s}
.wrap{max-width:1100px;margin:0 auto;padding:12px 12px 60px}
.tool{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.btn{display:inline-block;background:var(--rose);color:#fff;border:0;border-radius:99px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px}
.btn.ghost{background:#fff;color:var(--sub);border:1px solid var(--line);font-weight:400;font-size:12px;padding:6px 12px}
.hint{font-size:12px;color:var(--sub)}
#msg{font-size:12px;color:var(--rose);width:100%;min-height:1em}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;font-size:11px;color:var(--sub);gap:3px}
.filters select,.filters input[type=search]{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff;font-size:14px;width:100%}
.filters .chk{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--ink);align-self:end;padding-bottom:7px}
details{margin-bottom:14px}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:10px 12px;font-weight:900}
summary::-webkit-details-marker{display:none}
summary small{font-weight:400;color:var(--sub);font-size:12px}
summary::after{content:"▾";color:var(--sub);margin-left:8px;transition:transform .2s}
details:not([open]) summary::after{transform:rotate(-90deg)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(6,1fr);gap:10px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(8,1fr)}}
.tile{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile.own{border-color:var(--gold);box-shadow:0 0 0 1px #f6dfa6,0 3px 10px rgba(217,162,58,.25)}
.art{position:relative;aspect-ratio:5/7;border-radius:6px;overflow:hidden;background:#e6e2e6;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9a929a;font-size:10px;cursor:default}
.art.has{cursor:zoom-in;background:#fff}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art .ph{font-size:22px;line-height:1}
.off .art,.off .nm,.off .meta{opacity:.45}
.rib{position:absolute;left:-22px;top:9px;width:86px;transform:rotate(-40deg);background:#7d6b7a;color:#fff;font-size:9px;text-align:center;padding:1px 0;font-weight:700}
.badge{position:absolute;right:3px;bottom:3px;background:var(--gold);color:#fff;font-weight:900;font-size:11px;border-radius:99px;padding:1px 7px}
.cam{position:absolute;right:3px;top:3px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(255,255,255,.85);font-size:11px;padding:0;cursor:pointer;line-height:22px}
.nm{font-size:10px;line-height:1.3;font-weight:700;min-height:2.6em;word-break:break-all}
.meta{display:flex;flex-wrap:wrap;gap:2px;font-size:9px}
.meta span{border-radius:4px;padding:0 4px;line-height:1.5}
[data-t=キュート]{background:#ffdbe8;color:#b02a60}[data-t=クール]{background:#d8e8ff;color:#245a9e}
[data-t=セクシー]{background:#ead9ff;color:#6a2fa8}[data-t=ポップ]{background:#ffe9c2;color:#a35e0a}
[data-r=プレミアム]{background:#fdf0cc;color:#8a6310;font-weight:700}[data-r=アンコールレア]{background:#fde0ef;color:#b02a60;font-weight:700}
[data-r=レア]{background:#f1ecf5;color:#6b5a78}[data-r=ノーマル]{background:#f2f2f2;color:#777}[data-r=パラレル]{background:#dff5ee;color:#1d7a5c}
.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:auto}
.ctl button{height:28px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:13px;font-weight:700;padding:0;cursor:pointer}
.ctl button:active{background:#fde3ec}
.ctl .on{color:var(--gold);border-color:var(--gold);background:#fff9e8}
.empty{text-align:center;color:var(--sub);padding:40px 0}
#modal{position:fixed;inset:0;z-index:50;background:rgba(40,20,36,.82);display:none;align-items:center;justify-content:center;padding:16px;flex-direction:column;gap:10px}
#modal.show{display:flex}
#modal img{max-width:100%;max-height:82vh;border-radius:10px;background:#fff}
#modal .nmx{color:#fff;font-weight:700;font-size:14px}
:focus-visible{outline:3px solid #f0b83f;outline-offset:2px}
</style>
</head>
<body>
<header class="top">
  <h1>アイカツアンコールカード管理</h1>
  <p>アイカツアンコール 所持カード管理</p>
  <div class="prog"><b id="pt">0 / 0 (0%)</b><div class="bar"><i id="pb"></i></div></div>
</header>
<main class="wrap">
  <div class="tool">
    <label class="btn" for="up">📁 画像をアップロード</label>
    <input id="up" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
    <span class="hint">複数ファイル選択可能。順番に割り当てられます</span>
    <button class="btn ghost" id="clr" type="button">画像をすべて削除</button>
    <div id="msg" role="status"></div>
  </div>
  <div class="filters">
    <label>弾<select id="fSet"><option value="">すべて</option></select></label>
    <label>レアリティ<select id="fRar"><option value="">すべて</option></select></label>
    <label>タイプ<select id="fType"><option value="">すべて</option></select></label>
    <label>所持状況<select id="fOwn">
      <option value="">すべて</option><option value="own">所持あり（1枚以上）</option>
      <option value="none">未所持（0枚）</option><option value="multi">複数枚（2枚以上）</option></select></label>
    <label>カード名検索<input id="fQ" type="search" placeholder="カード名"></label>
    <label class="chk"><input id="fFav" type="checkbox">★のみ</label>
  </div>
  <div id="list"></div>
</main>
<div id="modal" role="dialog" aria-modal="true"><img id="mimg" alt=""><div class="nmx" id="mnm"></div></div>
<input id="one" type="file" accept="image/jpeg,image/png,image/webp" hidden>
<script>
const DATA=[["第一弾","オーロラキスキャミソール","キュート","プレミアム"],["第一弾","オーロラキスドレープスカート","キュート","プレミアム"],["第一弾","オーロラキスバレエシューズ","キュート","プレミアム"],["第一弾","オーロラキスリボン","キュート","プレミアム"],["第一弾","アイスブルーフリルキャミソール","キュート","レア"],["第一弾","アイスブルーフリルパニエ","キュート","レア"],["第一弾","アイスブルーシューズ","キュート","レア"],["第一弾","ジュエルつきパープルリボン","キュート","レア"],["第一弾","小花柄イエローワンピ","キュート","レア"],["第一弾","ドリーミースタートップス","キュート","レア"],["第一弾","ドリーミースタースカート","キュート","レア"],["第一弾","ドリーミースターパンプス","キュート","レア"],["第一弾","チャーミーリボントップス","キュート","レア"],["第一弾","チャーミーリボンスカート","キュート","レア"],["第一弾","チャーミーリボンサンダル","キュート","レア"],["第一弾","チャーミーリボンアクセ","キュート","レア"],["第一弾","クリアネスイエロートップス","キュート","レア"],["第一弾","クリアネスイエロースカート","キュート","レア"],["第一弾","クリアネスイエローパンプス","キュート","レア"],["第一弾","クリアネスイエローアクセ","キュート","レア"],["第一弾","ピンクステージベスト","キュート","ノーマル"],["第一弾","ピンクステージスカート","キュート","ノーマル"],["第一弾","ピンクステージシューズ","キュート","ノーマル"],["第一弾","パフスリーブレモンカラーボレロ","キュート","ノーマル"],["第一弾","ラベンダーフリルスカート","キュート","ノーマル"],["第一弾","イエロー編み上げブーツ","キュート","ノーマル"],["第一弾","ピンクブロッサムトップス","キュート","ノーマル"],["第一弾","ピンクブロッサムスカート","キュート","ノーマル"],["第一弾","ピンクブロッサムブーツ","キュート","ノーマル"],["第一弾","オデットスワンコーデ","キュート","アンコールレア"],["第一弾","リルリボンストーリーコーデ","キュート","アンコールレア"],["第一弾","オーロラペガサスコーデ","キュート","アンコールレア"],["第一弾","オーロラキスキャミソール","キュート","パラレル"],["第一弾","オーロラキスドレープスカート","キュート","パラレル"],["第一弾","オーロラキスバレエシューズ","キュート","パラレル"],["第一弾","オーロラキスリボン","キュート","パラレル"],["第一弾","オデットスワンコーデ","キュート","パラレル"],["第一弾","リルリボンストーリーコーデ","キュート","パラレル"],["第一弾","オーロラペガサスコーデ","キュート","パラレル"],["第一弾","天の川コズミックワンショルダー","クール","プレミアム"],["第一弾","天の川コズミックスカート","クール","プレミアム"],["第一弾","天の川コズミックブーツ","クール","プレミアム"],["第一弾","天の川コズミックカチューシャ","クール","プレミアム"],["第一弾","プリズムサイバーグラフィックワンピ","クール","レア"],["第一弾","ブラックモダンボレロ","クール","レア"],["第一弾","ブラックフューチャーエナメルショートパンツ","クール","レア"],["第一弾","ブラックフューチャーブーツ","クール","レア"],["第一弾","ブルーステージブラウス","クール","ノーマル"],["第一弾","ブルーステージスカート","クール","ノーマル"],["第一弾","ブルーステージブーツ","クール","ノーマル"],["第一弾","ブラックストライプジャケット","クール","ノーマル"],["第一弾","ダイヤモンドチェックスカート","クール","ノーマル"],["第一弾","ブルーストラップシューズ","クール","ノーマル"],["第一弾","ネイビーブロッサムトップス","クール","ノーマル"],["第一弾","ネイビーブロッサムスカート","クール","ノーマル"],["第一弾","ネイビーブロッサムブーツ","クール","ノーマル"],["第一弾","ドリームエネミンス","クール","アンコールレア"],["第一弾","天の川コズミックワンショルダー","クール","パラレル"],["第一弾","天の川コズミックスカート","クール","パラレル"],["第一弾","天の川コズミックブーツ","クール","パラレル"],["第一弾","天の川コズミックカチューシャ","クール","パラレル"],["第一弾","ドリームエネミンス","クール","パラレル"],["第一弾","レジェンダリールージュドレス","セクシー","プレミアム"],["第一弾","レジェンダリールージュパンプス","セクシー","プレミアム"],["第一弾","アゲハレッドコクーンワンピ","セクシー","レア"],["第一弾","アゲハレッドミュール","セクシー","レア"],["第一弾","パープルジュエリーワンピ","セクシー","レア"],["第一弾","ゴールドチェーングラディエーター","セクシー","レア"],["第一弾","アゲハロゴフリルトップス","セクシー","レア"],["第一弾","アゲハファーつきフリルスカート","セクシー","レア"],["第一弾","ブラックシフォンカチューシャ","セクシー","レア"],["第一弾","パープルステージトップス","セクシー","ノーマル"],["第一弾","パープルステージスカート","セクシー","ノーマル"],["第一弾","パープルステージパンプス","セクシー","ノーマル"],["第一弾","プッチがらシャイニングトップス","セクシー","ノーマル"],["第一弾","ブラックウォッシュデニムミニ","セクシー","ノーマル"],["第一弾","セクシーロゴチューブトップ","セクシー","ノーマル"],["第一弾","ベルトつきレザースカート","セクシー","ノーマル"],["第一弾","サイハイレザーブーツ","セクシー","ノーマル"],["第一弾","パープルブロッサムトップス","セクシー","ノーマル"],["第一弾","パープルブロッサムスカート","セクシー","ノーマル"],["第一弾","パープルブロッサムブーツ","セクシー","ノーマル"],["第一弾","サンシャインスターウェイトップス","ポップ","プレミアム"],["第一弾","サンシャインスターウェイスカート","ポップ","プレミアム"],["第一弾","サンシャインスターウェイシューズ","ポップ","プレミアム"],["第一弾","サンシャインスターウェイカチューシャ","ポップ","プレミアム"],["第一弾","サンライズスターウェイトップス","ポップ","プレミアム"],["第一弾","サンライズスターウェイスカート","ポップ","プレミアム"],["第一弾","サンライズスターウェイシューズ","ポップ","プレミアム"],["第一弾","サンライズスターウェイカチューシャ","ポップ","プレミアム"],["第一弾","サンセットスターウェイトップス","ポップ","プレミアム"],["第一弾","サンセットスターウェイスカート","ポップ","プレミアム"],["第一弾","サンセットスターウェイシューズ","ポップ","プレミアム"],["第一弾","サンセットスターウェイカチューシャ","ポップ","プレミアム"],["第一弾","イエローブロッサムトップス","ポップ","ノーマル"],["第一弾","イエローブロッサムスカート","ポップ","ノーマル"],["第一弾","イエローブロッサムブーツ","ポップ","ノーマル"]];
const RARITIES=["プレミアム","レア","ノーマル","アンコールレア","パラレル"];
const cards=DATA.map((r,i)=>({id:i,set:r[0],name:r[1],type:r[2],rar:r[3]}));
const K="aikatsuEncore_";
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(K+k))||d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v));return true}catch(e){return false}};
let qty=load("qty",{}),fav=load("fav",{}),imgs=load("imgs",{});
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uniq=a=>[...new Set(a)];
const sets=uniq(cards.map(c=>c.set));
const open=new Set([sets[0]]);

function fill(sel,arr){arr.forEach(v=>sel.insertAdjacentHTML("beforeend",`<option>${esc(v)}</option>`))}
fill($("#fSet"),sets);fill($("#fRar"),RARITIES);fill($("#fType"),uniq(cards.map(c=>c.type)));
["#fSet","#fRar","#fType","#fOwn","#fFav"].forEach(s=>$(s).addEventListener("change",render));
$("#fQ").addEventListener("input",render);

function msg(t){$("#msg").textContent=t}
function match(c){
  if($("#fSet").value&&c.set!==$("#fSet").value)return false;
  if($("#fRar").value&&c.rar!==$("#fRar").value)return false;
  if($("#fType").value&&c.type!==$("#fType").value)return false;
  const q=qty[c.id]||0,o=$("#fOwn").value;
  if(o==="own"&&q<1)return false;
  if(o==="none"&&q>0)return false;
  if(o==="multi"&&q<2)return false;
  if($("#fFav").checked&&!fav[c.id])return false;
  const s=$("#fQ").value.trim();
  if(s&&!c.name.includes(s))return false;
  return true;
}
function tile(c){
  const q=qty[c.id]||0,im=imgs[c.id];
  return `<div class="tile ${q?"own":"off"}" data-id="${c.id}">
  <div class="art ${im?"has":""}" ${im?'data-act="zoom"':""}>
    ${im?`<img src="${im}" alt="${esc(c.name)}" loading="lazy">`:`<span class="ph">📷</span><span>画像</span>`}
    ${q?`<span class="badge">×${q}枚</span>`:`<span class="rib">未所持</span>`}
    <button class="cam" data-act="pick" aria-label="この画像を設定">🖼</button>
  </div>
  <div class="nm">${esc(c.name)}</div>
  <div class="meta"><span data-t="${esc(c.type)}">${esc(c.type)}</span><span data-r="${esc(c.rar)}">${esc(c.rar)}</span></div>
  <div class="ctl">
    <button data-act="minus" aria-label="1枚減らす">−</button>
    <button data-act="plus" aria-label="1枚増やす">＋</button>
    <button data-act="copy" aria-label="カード名をコピー">⧉</button>
    <button data-act="fav" class="${fav[c.id]?"on":""}" aria-label="お気に入り">${fav[c.id]?"★":"☆"}</button>
  </div></div>`;
}
function render(){
  const y=scrollY;let h="";
  sets.forEach(s=>{
    const all=cards.filter(c=>c.set===s),list=all.filter(match);
    if(!list.length)return;
    const own=all.filter(c=>(qty[c.id]||0)>0).length;
    h+=`<details data-set="${esc(s)}" ${open.has(s)?"open":""}><summary><span>${esc(s)}</span><small>${own} / ${all.length}　表示 ${list.length}</small></summary><div class="grid">${list.map(tile).join("")}</div></details>`;
  });
  $("#list").innerHTML=h||'<div class="empty">条件に合うカードがありません</div>';
  const n=cards.filter(c=>(qty[c.id]||0)>0).length,p=Math.round(n/cards.length*100);
  $("#pt").textContent=`${n} / ${cards.length} (${p}%)`;$("#pb").style.width=p+"%";
  scrollTo(0,y);
}
$("#list").addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.set)d.open?open.add(d.dataset.set):open.delete(d.dataset.set)},true);

let pickId=null;
$("#list").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const id=+b.closest(".tile").dataset.id,a=b.dataset.act;
  if(a==="plus"){qty[id]=(qty[id]||0)+1;save("qty",qty);render()}
  else if(a==="minus"){qty[id]=Math.max(0,(qty[id]||0)-1);save("qty",qty);render()}
  else if(a==="fav"){fav[id]=!fav[id];save("fav",fav);render()}
  else if(a==="copy"){copy(cards[id].name)}
  else if(a==="pick"){e.stopPropagation();pickId=id;$("#one").click()}
  else if(a==="zoom"&&imgs[id]){$("#mimg").src=imgs[id];$("#mimg").alt=cards[id].name;$("#mnm").textContent=cards[id].name;$("#modal").classList.add("show")}
});
function copy(t){
  const ok=()=>msg(`「${t}」をコピーしました`);
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,()=>fb())}else fb();
  function fb(){const x=document.createElement("textarea");x.value=t;x.style.position="fixed";x.style.opacity="0";document.body.appendChild(x);x.select();try{document.execCommand("copy");ok()}catch(e){msg("コピーできませんでした")}x.remove()}
}
$("#modal").addEventListener("click",()=>$("#modal").classList.remove("show"));
addEventListener("keydown",e=>{if(e.key==="Escape")$("#modal").classList.remove("show")});

const compress=f=>new Promise((res,rej)=>{
  const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const s=Math.min(1,340/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",0.72))};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u;
});
const saveImgs=()=>{if(!save("imgs",imgs))msg("保存容量が足りません。画像の一部は次回開いたときに消えます")};
$("#up").addEventListener("change",async e=>{
  const files=[...e.target.files].sort((a,b)=>a.name.localeCompare(b.name,"ja",{numeric:true}));
  e.target.value="";if(!files.length)return;
  let n=0;
  for(const f of files){
    if(n>=cards.length)break;
    msg(`画像を処理中… ${n+1} / ${files.length}`);
    try{imgs[n]=await compress(f);n++}catch(_){}
  }
  saveImgs();render();
  msg(`${n}枚の画像を1番目のカードから順に割り当てました`+(files.length>cards.length?`（${files.length-cards.length}枚は余り）`:""));
});
$("#one").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f||pickId===null)return;
  try{imgs[pickId]=await compress(f);saveImgs();render();msg(`「${cards[pickId].name}」の画像を設定しました`)}catch(_){msg("画像を読み込めませんでした")}
});
$("#clr").addEventListener("click",()=>{
  if(!Object.keys(imgs).length){msg("削除する画像はありません");return}
  if(confirm("アップロードした画像をすべて削除します。所持数・お気に入りは残ります。")){imgs={};save("imgs",imgs);render();msg("画像を削除しました")}
});
render();
</script>
</body>
</html>
